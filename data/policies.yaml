- title: "誰も取り残さない特別支援教育"
  icon: "education"
  summary: "特別支援学級・通級指導の人員と予算を拡充し、現場の補助員が安心して働ける環境をつくります。"
  story: "現場に立つ補助員として、人手不足のまま一人ひとりに向き合う難しさを痛感してきました。"
- title: "医療的ケア児・障害児家庭への切れ目ない支援"
  icon: "care"
  summary: "診断直後から続く「情報のすき間」「制度のすき間」をなくし、家族が孤立しない相談体制を整えます。"
  story: "ダウン症のある子を育てる中で、必要な情報にたどり着くまでの遠さを実感しました。"
- title: "海外経験を活かした開かれた地域づくり"
  icon: "global"
  summary: "JETROや大使館勤務で得た国際的な視点を、多文化共生や地域の国際化施策に活かします。"
  story: "ロシアでの勤務経験から、異なる文化・立場への理解が地域を強くすることを学びました。"
- title: "子育て世代が孤立しないまちづくり"
  icon: "family"
  summary: "子育て中の親同士がつながれる場や相談窓口を増やし、孤独な子育てをなくします。"
  story: "一人の母として、誰かに話せることがどれだけ救いになるかを日々感じています。"
