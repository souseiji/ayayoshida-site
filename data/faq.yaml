- q: "どんな政治活動をしていますか？"
  a: "特別支援教育・障害児家庭支援・子育て支援を中心に活動しています。詳しくは「政策」セクションをご覧ください。"
- q: "ボランティアはどうすれば参加できますか？"
  a: "「応援する」セクションのボランティアフォームよりお申し込みください。できる範囲での参加で構いません。"
- q: "寄付はできますか？"
  a: "政治資金規正法に基づき、適切な方法での寄付受付を準備中です。詳細が決まり次第、こちらに掲載します。"
- q: "取材・お問い合わせはどこにすればいいですか？"
  a: "ページ下部のお問い合わせフォームより、ご用件をお送りください。"
