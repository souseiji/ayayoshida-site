message:
  heading: "なぜ、私は立つのか"
  lead: "誰かの「当たり前」が、誰かにとっては届かない現実がある。"
  body: |
    息子はダウン症をもって生まれてきました。
    特別支援学級の補助員として現場に立つ中で、そして一人の母として、
    「制度のすき間」で困っている人たちの声を、たくさん聞いてきました。

    上智大学でロシア語を学び、JETRO、在ロシア日本国大使館での勤務を通じて、
    海外から日本の福祉・教育制度を見つめ直す機会もありました。
    その差を、政治の力で埋めていきたいと思っています。

