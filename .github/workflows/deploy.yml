name: Build and open PR to ayayoshida03.github.io

on:
  push:
    branches: [main]

jobs:
  build-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Build
        run: hugo --minify

      - name: Checkout target repo (main)
        uses: actions/checkout@v4
        with:
          repository: ayayoshida03/ayayoshida03.github.io
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: target

      - name: Update staging preview (direct push, no PR)
        working-directory: target
        run: |
          rm -rf staging
          mkdir -p staging
          cp -r ../public/. staging/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add staging
          git diff --cached --quiet || git commit -m "Update staging preview [skip ci]"
          git push origin main

      - name: Sync built site into production branch
        working-directory: target
        run: |
          git checkout -B auto-deploy origin/main
          rsync -a --delete --exclude='.git' --exclude='staging' ../public/ .
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_ENV"
          else
            git commit -m "Deploy from ayayoshida-site@${{ github.sha }}"
            git push -f origin auto-deploy
            echo "changed=true" >> "$GITHUB_ENV"
          fi

      - name: Create pull request
        if: env.changed == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if gh pr view auto-deploy --repo ayayoshida03/ayayoshida03.github.io >/dev/null 2>&1; then
            echo "PR already open on auto-deploy branch; pushed new commit to it."
          else
            gh pr create --repo ayayoshida03/ayayoshida03.github.io \
              --head auto-deploy --base main \
              --title "サイト更新 ($(date +'%Y-%m-%d %H:%M'))" \
              --body "ayayoshida-site の main ブランチ (${{ github.sha }}) から自動生成されたビルド差分です。staging/ は含まれません（本番ルート直下のみが対象）。"
          fi
